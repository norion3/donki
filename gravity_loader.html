<!--
 * gravity_loader.html
 * @version v1.0 (GRAVITY Minimal Loader HTML - Phase 16 Final)
 * @changes
 *   - GRAVITY 管理画面登録用の Minimal Loader HTML を実装（Layer 1：開発者側本体 iframe 読み込み完全不使用）
 *   - <base href="https://norion3.github.io/donki/"> および 5分（300秒）キャッシュバスター付き完全絶対URL import() を実装
 *   - iPhone専用 viewport (user-scalable=no, viewport-fit=cover) および白フラッシュ防止・iOS WebKit完全マスクインラインCSS（input/textarea例外・16px自動ズーム防止付）を実装
 *   - main.js の dismissLoaderSplash() と連動する初期ローディングスピナー (#gravity-loader-splash) を実装
 *   - import() 失敗時に最新キャッシュバスターで再試行できる再読み込みUI（backdrop-filter不使用・<div role="button">）を実装
 -->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <base href="https://norion3.github.io/donki/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>ROBOT TOWER DK</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    input, textarea {
      user-select: text;
      -webkit-user-select: text;
      touch-action: manipulation;
      font-size: 16px;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      overscroll-behavior: none;
      -webkit-overscroll-behavior: none;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #gravity-loader-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: #0f172a;
      text-align: center;
      touch-action: none;
      overscroll-behavior: none;
    }

    .loader-spinner {
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      border: 3px solid rgba(148, 163, 184, 0.24);
      border-top-color: #38bdf8;
      animation: gravityLoaderSpin 0.85s linear infinite;
      margin-bottom: 14px;
    }

    .loader-title {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #f8fafc;
    }

    .loader-status {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
    }

    #loader-error-box {
      display: none;
      margin-top: 18px;
      max-width: 300px;
      padding: 14px 16px;
      border-radius: 16px;
      background-color: rgba(30, 41, 59, 0.96);
      border: 1px solid rgba(248, 113, 113, 0.45);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
    }

    #loader-error-msg {
      margin: 0 0 12px;
      font-size: 12px;
      line-height: 1.5;
      color: #fecaca;
      word-break: break-word;
    }

    #loader-reload-btn {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 12px;
      background: linear-gradient(90deg, #fbbf24 0%, #f97316 100%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.04em;
      cursor: pointer;
      touch-action: manipulation;
    }

    #loader-reload-btn:active {
      transform: scale(0.96);
    }

    @keyframes gravityLoaderSpin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="gravity-loader-splash" role="status" aria-live="polite">
    <div id="loader-spinner" class="loader-spinner" aria-hidden="true"></div>
    <p class="loader-title">ROBOT TOWER DK</p>
    <p id="loader-status" class="loader-status">読み込み中...</p>
    <div id="loader-error-box">
      <p id="loader-error-msg">アプリの読み込みに失敗しました。通信環境をご確認のうえ再読み込みしてください。</p>
      <div id="loader-reload-btn" role="button" tabindex="0">再読み込み</div>
    </div>
  </div>

  <script type="module">
    const BASE_URL = 'https://norion3.github.io/donki/';
    const spinnerEl = document.getElementById('loader-spinner');
    const statusEl = document.getElementById('loader-status');
    const errorBoxEl = document.getElementById('loader-error-box');
    const reloadBtnEl = document.getElementById('loader-reload-btn');

    let isLoading = false;
    let lastRetryTapAt = 0;

    function setLoadingUI() {
      if (spinnerEl) spinnerEl.style.display = 'block';
      if (statusEl) statusEl.textContent = '読み込み中...';
      if (errorBoxEl) errorBoxEl.style.display = 'none';
    }

    function showLoadError() {
      if (spinnerEl) spinnerEl.style.display = 'none';
      if (statusEl) statusEl.textContent = '読み込みエラー';
      if (errorBoxEl) errorBoxEl.style.display = 'block';
    }

    function loadApp(forceFresh = false) {
      if (isLoading) return;
      isLoading = true;
      setLoadingUI();

      // 初回は5分（300秒）キャッシュバスター、失敗後の再試行時は即時フレッシュパラメータで再取得
      const cacheBuster = forceFresh ? Date.now() : Math.floor(Date.now() / 300000);
      const entryUrl = `${BASE_URL}main.js?v=${cacheBuster}`;

      import(entryUrl)
        .then(() => {
          isLoading = false;
        })
        .catch((err) => {
          isLoading = false;
          console.error('[GravityLoader] Failed to load main.js:', err);
          showLoadError();
        });
    }

    if (reloadBtnEl) {
      const triggerRetry = (e) => {
        if (e) e.stopPropagation();
        const now = Date.now();
        if (now - lastRetryTapAt < 350) return;
        lastRetryTapAt = now;
        loadApp(true);
      };

      reloadBtnEl.addEventListener('touchstart', (e) => { e.stopPropagation(); }, { passive: true });
      reloadBtnEl.addEventListener('touchmove', (e) => { e.stopPropagation(); }, { passive: true });
      reloadBtnEl.addEventListener('touchend', (e) => {
        e.stopPropagation();
        if (e.cancelable) e.preventDefault();
        triggerRetry(e);
      }, { passive: false });
      reloadBtnEl.addEventListener('touchcancel', (e) => { e.stopPropagation(); }, { passive: true });
      reloadBtnEl.addEventListener('mousedown', (e) => { e.stopPropagation(); });
      reloadBtnEl.addEventListener('mouseup', (e) => { e.stopPropagation(); });
      reloadBtnEl.addEventListener('click', triggerRetry);
    }

    loadApp(false);
  </script>
</body>
</html>
